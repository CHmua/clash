;OpenClash / Subconverter GitHub Raw 远程配置模板
;版本：v64_ini_from_v63
;基准：clash_worker_v63_lowercase_clash_meta.txt
;用途：上传到 GitHub 后复制 Raw 链接，在 OpenClash 订阅转换里作为远程配置使用
;
;注意：
;1. 这是 .ini 订阅转换模板，不是 Cloudflare Worker，不是网页后台
;2. 需要配合 OpenClash 的订阅转换功能或 subconverter 使用
;3. 真实订阅链接不写在这个 ini 里，由 OpenClash 订阅转换时填写
;4. 规则基于 v63 管理员版整理，保留 AI / Google / TikTok / Steam / 游戏 / 影视站直连等规则

